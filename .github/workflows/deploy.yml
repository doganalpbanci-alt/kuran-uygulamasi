name: Deploy to GitHub Pages

on:
  push:
    # Dal adına bağlı kalmamak için hepsini dinleyip aşağıda varsayılan
    # dala filtreliyoruz; depo main'e geçse de çalışmaya devam eder.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; devam eden bir çalışma iptal edilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # enablement, Pages kaynağını "GitHub Actions"a çevirir. Depo "Deploy
      # from a branch" modundaysa bu adım onu düzeltir; aksi halde derlenmemiş
      # kaynak yayınlanır ve site boş açılır.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build
        # Pages projeyi /<repo-adı>/ altında yayınlar.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
